# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Express/TypeScript API as a Node web service.
# Secrets marked `sync: false` are prompted in the Render dashboard.

services:
  - type: web
    name: student-db-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
